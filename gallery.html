<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Gallery</title>
  <style>
    body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f4f4f4;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1rem;
  padding: 2rem;
}

.product-card {
  background: white;
  padding: 1rem;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  text-align: center;
  transition: transform 0.3s;
  display: flex;
  flex-direction: column;
  justify-content: center;
  height: 200px; /* Equal height */
}

.product-card:hover {
  transform: scale(1.05);
}

/* Responsive Layouts */
@media (max-width: 900px) {
  .gallery {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {
  .gallery {
    grid-template-columns: 1fr;
  }
}
  </style>
</head>
<body>
  <section class="gallery">
    <div class="product-card">
      <h3>Product 1</h3>
      <p>$19.99</p>
    </div>
    <div class="product-card">
      <h3>Product 2</h3>
      <p>$24.99</p>
    </div>
    <div class="product-card">
      <h3>Product 3</h3>
      <p>$14.99</p>
    </div>
    <div class="product-card">
      <h3>Product 4</h3>
      <p>$29.99</p>
    </div>
    <div class="product-card">
      <h3>Product 5</h3>
      <p>$9.99</p>
    </div>
    <div class="product-card">
      <h3>Product 6</h3>
      <p>$39.99</p>
    </div>
    <div class="product-card">
      <h3>Product 7</h3>
      <p>$49.99</p>
    </div>
    <div class="product-card">
      <h3>Product 8</h3>
      <p>$59.99</p>
    </div>
  </section>
</body>
</html>
