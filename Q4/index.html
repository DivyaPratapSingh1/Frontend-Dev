<!doctype html>
<html>
<head><meta charset="utf-8"><title>Q4 - Theme Switcher</title>
<style>
  body[data-theme="light"]{background:#fff;color:#000}
  body[data-theme="dark"]{background:#121212;color:#f1f1f1}
  body[data-theme="blue"]{background:#e7f0ff;color:#003366}
  .btn{padding:6px 10px;margin:4px}
</style>
</head>
<body data-theme="light">
<h2>Theme Switcher</h2>
<button class="btn" data-theme="light">Light</button>
<button class="btn" data-theme="dark">Dark</button>
<button class="btn" data-theme="blue">Blue</button>

<script src="Q4.js"></script>
</body>
</html>
