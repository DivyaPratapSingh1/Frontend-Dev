<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q9 - Multi jQuery Widgets</title>
  <!-- older jQuery v1 -->
  <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
  <!-- newer jQuery v3 -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="multi-jquery-widgets.js"></script>
  <style>.widget{padding:12px;border:1px solid #ddd;margin:8px}.active{border-color:green}</style>
</head>
<body>
  <main>
    <h1>Dashboard Widgets</h1>
    <div id="carousel" class="widget">Carousel area</div>
    <div id="modalArea" class="widget">Modal notifications</div>
    <div id="widgetsList" class="widget">Widgets list</div>
    <div id="tooltips" class="widget">Hover over me for tooltip</div>
  </main>
</body>
</html>
