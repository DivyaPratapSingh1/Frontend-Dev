<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q1 - Welcome Greeting</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="welcome-greeting.js"></script>
  <style>
    body{font-family:system-ui, Arial; padding:20px}
    .welcome{padding:20px;border-radius:8px;background:#f3f3f3}
  </style>
</head>
<body>
  <header><h1>Welcome Page</h1></header>
  <main>
    <section class="welcome" id="greetingBox">
      <h2 id="greeting">Hello!</h2>
      <p id="welcomeMsg">We're glad you're here.</p>
      <button id="changeGreeting">Change Greeting</button>
      <button id="toggleWelcome">Toggle Welcome Message</button>
    </section>
    <section><h3>Extras</h3><ul><li>Time-based greeting</li><li>Quote</li><li>Toggle</li><li>Alert on click</li><li>Accessible</li></ul></section>
  </main>
</body>
</html>
