<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q4 - Special Offer Banners</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="special-offer-banner.js"></script>
  <style>
    .banner{padding:16px;margin:8px;border-radius:6px;background:#ffd;}
    .controls button{margin-right:6px}
  </style>
</head>
<body>
  <main>
    <h1>Special Offers</h1>
    <div class="controls">
      <button id="hide">Hide</button>
      <button id="show">Show</button>
      <button id="slideUp">Slide Up</button>
      <button id="slideDown">Slide Down</button>
      <button id="fadeOut">Fade Out</button>
      <button id="fadeIn">Fade In</button>
    </div>

    <section id="banners">
      <div class="banner">Banner 1 — 20% off</div>
      <div class="banner">Banner 2 — Free shipping</div>
      <div class="banner">Banner 3 — Buy 1 Get 1</div>
      <div class="banner">Banner 4 — Student discount</div>
      <div class="banner">Banner 5 — Limited time</div>
    </section>
  </main>
</body>
</html>
