<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mayank Yadav | Portfolio</title>
  <style>
    * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background: #f9f9f9;
  color: #333;
}

/* Header */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 2rem;
  background: linear-gradient(to right, #6a11cb, #2575fc);
  color: white;
}

.header-right a {
  margin-left: 1rem;
  color: white;
  text-decoration: none;
}
.container {
  display: flex;
  flex-direction: column;
  min-height: 100vh; /* Full viewport height */
}
html, body {
  height: 100%;
  margin: 0;
}



/* Main Area */
main {
  flex:1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 2rem;
  gap: 2rem;
}

.about, .image {
  flex: 1;
  text-align: center;
}

.image img {
  height: 20%;
  width:20%;
  border-radius: 10px;
}

/* Footer */
footer {
  text-align: center;
  padding: 1rem;
  background: #333;
  color: white;
 
}

/* Responsive Layout */
@media (max-width: 700px) {
  header {
    flex-direction: column;
    text-align: center;
  }

  main {
    flex-direction: column;
  }

  .header-right {
    margin-top: 0.5rem;
  }
}
  </style>
</head>
<body>
    <div class="container">
    <header>
        <div class="header-left">Mayank Yadav</div>
        <nav class="header-right">
        <a href="#">Home</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <section class="about">
        <h2>About Me</h2>
        <p>I’m a web developer passionate about responsive design, Flexbox layouts, and visual polish.</p>
        </section>
        <section class="image">
        <img src="https://tse4.mm.bing.net/th/id/OIP.Kk4i-k-7bOfsgPv0SJtj5AHaHa?rs=1&pid=ImgDetMain&o=7&rm=3" alt="Profile Image" />
        </section>
    </main>

    <footer>
        <p>© 2025 Mayank Yadav. All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
