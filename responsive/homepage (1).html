<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homepage Layout</title>
  <style>
    /* Reset and base styles */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  font-family: 'Segoe UI', sans-serif;
  background: #f0f4f8;
}

/* Flex container for sticky footer */
.container {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Header */
header {
  background: #1e3a8a; /* Indigo */
  padding: 1rem;
}

nav {
  display: flex;
  justify-content: space-around;
}

nav a {
  color: #ffffff;
  text-decoration: none;
  font-weight: bold;
  transition: color 0.3s;
}

nav a:hover {
  color: #facc15; /* Amber */
}

/* Main */
main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 2rem;
  padding: 2rem;
  flex-wrap: wrap;
  background: #e0f2fe; /* Light blue */
}

.box {
  background: #ffffff;
  padding: 2rem;
  width: 250px;
  height: 150px;
  border-radius: 10px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  text-align: center;
  font-size: 1.2rem;
  font-weight: 600;
  color: #1e293b; /* Slate */
  transition: transform 0.3s, background 0.3s;
}

.box:hover {
  transform: rotate(2deg);
  background: #dbeafe; /* Soft blue on hover */
}

/* Footer */
footer {
  background: #1e3a8a;
  color: white;
  text-align: center;
  padding: 1rem;
}

/* Responsive layout */
@media (max-width: 768px) {
  main {
    flex-direction: column;
    align-items: center;
  }
}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <nav>
        <a href="#">Home</a>
        <a href="#">Services</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <main>
      <div class="box">Services</div>
      <div class="box">Projects</div>
      <div class="box">Contact</div>
    </main>

    <footer>
      <p>© 2025 Your Name. All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
