<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading Animation</title>
  <style>
    /* Center the loader */
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f0f4f8;
}

/* Loader container */
.loader {
  display: flex;
  gap: 1rem;
}

/* Circle styles */
.circle {
  width: 20px;
  height: 20px;
  background: #1e3a8a;
  border-radius: 50%;
  animation: bounce 0.6s ease-in-out infinite;
}

/* Delays for staggered bounce */
.delay-1 {
  animation-delay: 0s;
}
.delay-2 {
  animation-delay: 0.2s;
}
.delay-3 {
  animation-delay: 0.4s;
}

/* Bounce animation */
@keyframes bounce {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-15px);
  }
}
  </style>
</head>
<body>
  <div class="loader">
    <div class="circle delay-1"></div>
    <div class="circle delay-2"></div>
    <div class="circle delay-3"></div>
  </div>
</body>
</html>
