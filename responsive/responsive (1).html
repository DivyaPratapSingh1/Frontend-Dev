<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Layout</title>
  <style>
    /* Reset and base styles */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background: #f4f4f4;
  color: #333;
}

/* Container grid layout */
.container {
  display: grid;
  grid-template-areas:
    "header"
    "main"
    "footer";
  grid-template-rows: auto 1fr auto;
  min-height: 100vh;
}

/* Header using Flexbox */
header {
  grid-area: header;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #1e3a8a;
  color: white;
  padding: 1rem 2rem;
}

nav a {
  color: white;
  margin-left: 1rem;
  text-decoration: none;
  font-weight: bold;
}

/* Main grid: article + sidebar */
main {
  grid-area: main;
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 1rem;
  padding: 2rem;
}

/* Article section */
article {
  background: white;
  padding: 1rem;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

/* Flexbox inside article */
.flex-boxes {
  display: flex;
  gap: 1rem;
  margin-top: 1rem;
  flex-wrap: wrap;
}

.box {
  flex: 1;
  min-width: 100px;
  background: #e0f2fe;
  padding: 1rem;
  border-radius: 6px;
  text-align: center;
}

/* Sidebar */
aside {
  background: white;
  padding: 1rem;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

/* Footer */
footer {
  grid-area: footer;
  background: #1e3a8a;
  color: white;
  text-align: center;
  padding: 1rem;
}

/* Animation */
.animated-title {
  animation: fadeUp 1s ease-in-out;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Responsive layout */
@media (max-width: 768px) {
  main {
    grid-template-columns: 1fr;
  }

  .flex-boxes {
    flex-direction: column;
  }

  header {
    flex-direction: column;
    text-align: center;
  }

  nav {
    margin-top: 0.5rem;
  }
}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">MySite</div>
      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <main>
      <article>
        <h1 class="animated-title">Welcome to MySite</h1>
        <div class="flex-boxes">
          <div class="box">Box 1</div>
          <div class="box">Box 2</div>
          <div class="box">Box 3</div>
        </div>
      </article>
      <aside>
        <h2>Sidebar</h2>
        <p>Additional content or links go here.</p>
      </aside>
    </main>

    <footer>
      <p>© 2025 MySite. All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
