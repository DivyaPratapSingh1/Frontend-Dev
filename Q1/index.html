<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Q1 - Dynamic Product List Manager</title>
<style>
  body{font-family:system-ui;padding:20px}
  #productInput{width:300px;padding:6px}
  ul{list-style:none;padding:0}
  li{padding:8px;border:1px solid #ddd;margin:6px 0;display:flex;align-items:center;gap:8px}
  .edit-input{flex:1;padding:4px}
  .btn{padding:4px 8px;cursor:pointer}
</style>
</head>
<body>
<h2>Product List Manager</h2>
<input id="productInput" placeholder="Enter product name">
<button id="addBtn" class="btn">Add</button>
<ul id="productList"></ul>

<script src="Q1.js"></script>
</body>
</html>
