<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Layout</title>
  <style>
    * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background: #f4f4f4;
}

/* Grid container */
.dashboard {
  display: grid;
  grid-template-areas:
    "header header"
    "sidebar main";
  grid-template-columns: 1fr 3fr;
  grid-template-rows: auto 1fr;
  min-height: 100vh;
  grid-gap: 1rem;
  padding: 1rem;
}

/* Header */
header {
  grid-area: header;
  background: #1e3a8a;
  color: white;
  padding: 1rem;
  text-align: center;
  font-size: 1.5rem;
}

/* Sidebar */
aside {
  grid-area: sidebar;
  background: #ffffff;
  padding: 1rem;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

aside nav {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

aside a {
  text-decoration: none;
  color: #1e3a8a;
  font-weight: bold;
}

/* Main content */
main {
  grid-area: main;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  grid-gap: 1rem;
}

/* Boxes */
.box {
  background: white;
  padding: 2rem;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  transition: transform 0.3s, box-shadow 0.3s;
  text-align: center;
  font-weight: 600;
}

.box:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 16px rgba(0,0,0,0.2);
}

/* Span box */
.span-2 {
  grid-column: span 2;
}

/* Responsive layout */
@media (max-width: 768px) {
  .dashboard {
    grid-template-areas:
      "header"
      "main"
      "sidebar";
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
  }

  main {
    grid-template-columns: 1fr;
  }

  .span-2 {
    grid-column: span 1;
  }
}
  </style>
</head>
<body>
  <div class="dashboard">
    <header>Dashboard Header</header>
    <aside>
      <nav>
        <a href="#">Overview</a>
        <a href="#">Reports</a>
        <a href="#">Settings</a>
      </nav>
    </aside>
    <main>
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box span-2">Box 3 (spans 2 columns)</div>
      <div class="box">Box 4</div>
    </main>
  </div>
</body>
</html>
