<!doctype html>
<html>
<head><meta charset="utf-8"><title>Q6 - Real-Time Table Filter</title>

<body>

    <tr><td>Edward</td><td>EE</td><td>7.9</td></tr>
  </tbody>
</table>
<div id="nores">No results found</div>
<script src="Q6.js"></script>
</body>
</html>
