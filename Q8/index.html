<!doctype html>
<html><head><meta charset="utf-8"><title>Q8 - Custom Dropdown</title>
<style>
  body{font-family:system-ui;padding:20px}
  .dropdown{position:relative;display:inline-block}
  .options{position:absolute;top:100%;left:0;border:1px solid #ccc;background:#fff;display:none;min-width:150px}
  .options div{padding:8px;cursor:pointer}
  .options div:hover{background:#eee}
</style>
</head>
<body>
<h2>Custom Dropdown</h2>
<div class="dropdown" id="dd">
  <button id="ddBtn">Choose</button>
  <div class="options" id="opts">
    <div data-val="one">Option One</div>
    <div data-val="two">Option Two</div>
    <div data-val="three">Option Three</div>
  </div>
</div>
<script src="Q8.js"></script>
</body></html>
